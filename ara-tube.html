        async function newVideoStart(filename, chapter = 0, play = true) {
            parts.titleName.textContent = fileNameToDisplayName(filename);
            parts.songName.textContent = document.getElementById(`${filename}-${chapter}`).textContent.slice(10);
            songActivate(`${filename}-${chapter}`);
            if (filename != sourcePathToFileName(video.src)) {
                titleActivate(filename);
                video.src = mp4Foldder + filename;
                video.load();
                await new Promise(resolve => video.addEventListener('canplay', resolve, { once: true }));
                const track = video.textTracks[0];
                while (track.cues && track.cues.length > 0) {
                    track.removeCue(track.cues[0]);
                }
                track.mode = "showing";
                Object.keys(videotimes[filename]).forEach(function(index){
                    const chapter = videotimes[filename][index];
                    if (chapter["end"] == "-") {
                        const cue = new VTTCue(chapter["start"], video.duration, chapter["title"]);
                        cue.id = index;
                        track.addCue(cue);
                    } else {
                        const cue = new VTTCue(chapter["start"], chapter["end"], chapter["title"]);
                        cue.id = index;
                        track.addCue(cue);
                    }
                });                
                video.currentTime = videotimes[filename][chapter]["start"]; 
                if (play == true) { video.play(); }
            } else {
                video.currentTime = videotimes[filename][chapter]["start"]; 
                if (play == true) { video.play(); }
            }
        }

        // *********************************
        // 再生されているビデオのリストをアクティベート
        // *********************************
        function titleActivate(filename) {
            document.querySelectorAll(".movie-title.active").forEach(function(title){
                title.classList.remove("active");
                title.parentElement.classList.remove("active");
            });
            document.getElementById(filename).classList.add("active");            
            document.getElementById(filename).parentElement.classList.add("active");            
            parts.titleName.textContent = fileNameToDisplayName(filename);
        }

        function songActivate(id) {
            document.querySelectorAll(".song.active").forEach(function(song) {
                song.classList.remove("active");
            });
            document.getElementById(id).classList.add("active");
            parts.songName.textContent = document.getElementById(id).textContent.slice(10);
        }
        
        // リストの生成
        let html = "";
        Object.keys(videotimes).forEach(function(id){
            html += `<div class="movie">`
            html += `<div class="movie-header">`
            html += `<div class="movie-title" id="${id}">${fileNameToDisplayName(id)}</div><div id="open-close-${id}" class="open-close">▲</div></div>`;
            Object.keys(videotimes[id]).forEach(function(key){
                html += `<div id="${id}-${key}" class="song">${videotimes[id][key]["hms"]} - ${videotimes[id][key]["title"]}</div>`
            })
            html += "</div>"
        });
        parts.list.innerHTML = html;
        titleActivate(Object.keys(nextvideos)[0]);

        document.querySelectorAll(".open-close").forEach(function(button){
            button.addEventListener("click", function(){
                if(button.textContent == "▲") {
                    button.parentElement.parentElement.querySelectorAll(".song").forEach(function(song){
                        song.classList.add("hidden");
                    });
                    button.textContent = "▼";
                } else {
                    button.parentElement.parentElement.querySelectorAll(".song").forEach(function(song){
                        song.classList.remove("hidden");
                    });
                    button.textContent = "▲";
                }
            });
        });

        // 動画・チャプター選択を埋め込み
        Object.keys(videotimes).forEach(function(filename){
            // 【1】動画選択
            document.getElementById(filename).addEventListener("click", function(){
                newVideoStart(filename);
            });
            // 【2】チャプター選択
            Object.keys(videotimes[filename]).forEach(function(index){
                let song = document.getElementById(`${filename}-${index}`);
                song.addEventListener("click", function(){
                    newVideoStart(filename, index);
                });
            });
        });

        // 初期ビデオ設定
        video.addEventListener("ended", function(){
            const nowVideo = sourcePathToFileName(video.src);
            newVideoStart(nextvideos[nowVideo]);
        });

        const track = video.addTextTrack("chapters", "Chapters", "ja");
        track.addEventListener("cuechange", function(){
            const activeCues = track.activeCues; 
            if (activeCues.length > 0) {
                const currentCue = activeCues[activeCues.length - 1];
                const filename = sourcePathToFileName(video.src);
                songActivate(`${filename}-${currentCue["id"]}`);
            }
        });

        newVideoStart(Object.keys(nextvideos)[0], 0, false);

        function headsearch(timeString){
            const seconds = timeString.split(':').reverse().reduce((prev, cur, idx) => prev + cur * Math.pow(60, idx), 0);
            document.querySelector("video").currentTime = seconds;
        }
    </script>
</body>
</html>
